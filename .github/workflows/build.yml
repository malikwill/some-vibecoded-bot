name: Build

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build MacroBot
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: latest
          cli: latest
          target: Android64

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacroBot-Android64
          path: ${{ steps.build.outputs.build-output }}

# NOTE: this mod is Android-x64-only (per mod.json's "gd" block, which only
# declares an android version). If you later want Windows/macOS builds too,
# add "win"/"mac" entries under "gd" in mod.json first, then re-add matrix
# entries for Win64/MacOS here — building those without the matching "gd"
# entry fails at CMake configure time with:
#   "string sub-command JSON member 'gd win' not found."
